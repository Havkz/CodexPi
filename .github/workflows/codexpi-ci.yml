name: Regression tests
run-name: CodexPi CI · ${{ inputs.commit || github.sha }}
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact pushed commit to verify
        required: false
        type: string
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        python: ['3.11', '3.13']
    runs-on: [self-hosted, Windows, X64, codexpi]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.platform == 'windows'
        with:
          python-version: ${{ matrix.python }}
          version: '0.10.7'
          activate-environment: true
          no-project: true
          enable-cache: false
      - run: uv pip install -r requirements.txt
        if: matrix.platform == 'windows'
      - run: python -m unittest discover -s tests
        if: matrix.platform == 'windows'
      - name: Install Chromium layout checks
        if: matrix.platform == 'windows' && matrix.python == '3.13'
        run: |
          uv pip install -r requirements-ui.txt
          python -m playwright install chromium
      - name: Mobile dashboard layouts
        if: matrix.platform == 'windows' && matrix.python == '3.13'
        run: python Setup/verify-mobile-ui.py
      - name: Dashboard screenshots
        if: always() && matrix.platform == 'windows' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-layouts
          path: state/mobile-ui/
          if-no-files-found: ignore
      - name: Linux tests on this PC (service-owned WSL)
        if: matrix.platform == 'linux'
        run: python C:/CodexPi/Setup/run-linux-ci.py --project codexpi --python '${{ matrix.python }}'
